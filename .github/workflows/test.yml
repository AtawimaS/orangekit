# The plugin's hooks run under bash on every OS Claude Code supports: macOS (/bin/bash 3.2 · BSD tools),
# Linux (GNU tools · mawk · procps) and Windows (Git Bash · MSYS). A suite that only ever runs on one of them lets the
# other two break silently — CRLF checkouts, GNU `stat -f`, the Store python3 alias and BSD `awk -v` all did.
# The Windows runner keeps git's core.autocrlf=true, so the checkout itself is the CRLF test that .gitattributes answers.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege; actions: read lets the last step read this job's step times back from the API
permissions:
  contents: read
  actions: read

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Windows only: Defender scans every process launch and file touch, and the suite starts tens of thousands of
      # short-lived jq.exe / awk / grep processes (run 7: doctor --self-test 27.5 min, guide-gate 15.8 min, job 53.4 min).
      # Excluding the workspace, the temp dirs the tests write to, Git for Windows (bash, awk, sed…) and jq's directory
      # changes no test — only the scan overhead. continue-on-error: a runner without the cmdlet still runs the suite.
      - name: Exclude test paths from Defender (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, 'C:\Program Files\Git')
          $jq = Get-Command jq -ErrorAction SilentlyContinue
          if ($jq) { $paths += (Split-Path $jq.Source) }
          $paths = $paths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          Add-MpPreference -ExclusionPath $paths
          Write-Host "Defender exclusions:"; (Get-MpPreference).ExclusionPath | ForEach-Object { Write-Host "  $_" }

      - name: Environment
        run: |
          bash --version | head -1
          jq --version
          python3 --version || python --version
          git config --get core.autocrlf || echo "core.autocrlf unset"

      - name: Shipped scripts are LF after checkout
        run: |
          # Actions runs bash with -e -o pipefail: grep -l exits 1 on a clean file, so it is guarded
          # tr counts bytes: Git Bash grep strips a trailing CR in text mode and would see none
          crlf=$(git ls-files '*.sh' | while IFS= read -r f; do [ "$(tr -dc '\r' < "$f" | wc -c)" -gt 0 ] && echo "$f"; done || true)
          [ -z "$crlf" ] || { echo "CRLF in: $crlf"; exit 1; }

      - name: doctor --default
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash scripts/doctor.sh --default
      - name: doctor --self-test
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash scripts/doctor.sh --self-test
      - name: doctor --consumer
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash scripts/doctor.sh --consumer
      - name: skill-lint
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: |
          bash skills/skill-enhancer/scripts/skill-lint.sh --self-test
          bash skills/skill-enhancer/scripts/skill-lint.sh skills/*/ marketing/skills/*/ harness/skills/*/
      - name: orangekit-update --self-test
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash skills/orangekit-update/scripts/orangekit-update.sh --self-test
      - name: orangekit-feedback drafts --self-test
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash skills/orangekit-feedback/scripts/drafts.sh --self-test
      - name: image-gen --self-test
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash skills/image-generator/scripts/image-gen.sh --self-test
      - name: guide-gate --self-test
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash skills/stack-guide-generator/scripts/guide-gate.sh --self-test
      - name: pack-smoke --self-test
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash skills/stack-guide-generator/scripts/pack-smoke.sh --self-test
      - name: pack-refresh --self-test
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash harness/skills/pack-refresh/scripts/pack-refresh.sh --self-test
      - name: routing-eval --self-test
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: bash harness/skills/harness-evaluation/scripts/routing-eval.sh --self-test

      # Measurement, not a gate: security-check spawns ~70–90 processes per Bash call (measured on macOS), and process
      # creation is far slower under Git Bash. The hook timeout is 15s — past it the command runs unchecked
      - name: Hook latency (security-check, typical Bash calls)
        if: ${{ !cancelled() }}   # keep going after a failure so every OS reports every step
        run: |
          p="$RUNNER_TEMP/latency" && mkdir -p "$p" && cd "$p" && git init -q
          TIMEFORMAT='%R s'
          for c in "git status" "npm test" "ls -la && cat package.json | head -20"; do
            printf '%-40s ' "$c"
            { time (jq -nc --arg c "$c" --arg cwd "$p" '{hook_event_name:"PreToolUse",tool_name:"Bash",tool_input:{command:$c},cwd:$cwd,session_id:"ci"}' \
                | CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" CLAUDE_PROJECT_DIR="$p" bash "$GITHUB_WORKSPACE/scripts/security-check.sh" >/dev/null 2>&1); } 2>&1
          done

      # Per-step durations of this job, so runs can be compared without opening each step in the UI
      - name: Step times
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '
            .jobs[] | select(.name | contains("${{ matrix.os }}")) | .steps[] | select(.completed_at != null)
            | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) as $s
            | "\(if $s >= 90 then "\($s / 60 * 10 | floor / 10) min" else "\($s) s" end)\t\(.conclusion)\t\(.name)"' \
            | awk -F'\t' '{ printf "%-9s %-9s %s\n", $1, $2, $3 }' || echo "step times unavailable (API or token)"
